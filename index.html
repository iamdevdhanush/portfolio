        config: {
          theme: {
            extend: {

                card: '#171719',
                border: '#292929',

    <style>
      :root {
        --bg-canvas: #0B0C0E;
        --bg-surface: #111214;
        --bg-card: #171719;
        --accent: #F28C28;
        --text-primary: #F5F2ED;
        --text-secondary: #929292;
        --border: #292929;
      }
      body {
        font-family: 'Plus Jakarta Sans', Inter, sans-serif;
        background-color: #0B0C0E;
        color: #F5F2ED;
        overflow-x: hidden;
      }
      html {
        scroll-behavior: smooth;
        background-color: #0B0C0E;
      }
      ::selection {
        background-color: #F28C28;
        color: #0B0C0E;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0B0C0E;
      }
      ::-webkit-scrollbar-thumb {
        background: #292929;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #F28C28;
      }
      @keyframes heroFadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes heroScale {
        from {
          opacity: 0;
          transform: scale(0.96) translateY(12px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes ambientBreathe {
        0%, 100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.04);
        }
      }
      @keyframes modalEnter {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes modalBackdrop {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-ambient-breathe {
        animation: ambientBreathe 14s ease-in-out infinite;
        will-change: opacity, transform;
      }
      .animate-modal-enter {
        animation: modalEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-modal-backdrop {
        animation: modalBackdrop 0.25s ease-out forwards;
      }
      .hero-enter-1 {
        animation: heroFadeUp 600ms cubic-bezier(0.16, 1, 0.3, 1) 40ms backwards;
      }
      .hero-enter-2 {
        animation: heroFadeUp 650ms cubic-bezier(0.16, 1, 0.3, 1) 120ms backwards;
      }
      .hero-enter-3 {
        animation: heroFadeUp 650ms cubic-bezier(0.16, 1, 0.3, 1) 200ms backwards;
      }
      .hero-enter-4 {
        animation: heroFadeUp 700ms cubic-bezier(0.16, 1, 0.3, 1) 280ms backwards;
      }
      .hero-enter-5 {
        animation: heroFadeUp 700ms cubic-bezier(0.16, 1, 0.3, 1) 360ms backwards;
      }
      .hero-enter-6 {
        animation: heroFadeUp 700ms cubic-bezier(0.16, 1, 0.3, 1) 460ms backwards;
      }
      .hero-portrait {
        animation: heroScale 750ms cubic-bezier(0.16, 1, 0.3, 1) 160ms backwards;
      }
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
