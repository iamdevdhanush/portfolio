    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              colors: {
                paper: '#F1EBDD',
                'paper-light': '#FAF7F0',
                ink: '#151515',
                'ink-dark': '#090909',
                vermilion: {
                  DEFAULT: '#F04B16',
                  hover: '#D93E0D',
                  light: 'rgba(240, 75, 22, 0.12)',
                },
                'muted-ink': '#8A877F',
                'paper-border': '#E2DAC8',
                'ink-border': '#2A2A2A',
              },
              fontFamily: {
                display: ['"Anton"', '"Bebas Neue"', 'sans-serif'],
                serif: ['"Instrument Serif"', '"Playfair Display"', 'Georgia', 'serif'],
                sans: ['"DM Sans"', '-apple-system', 'sans-serif'],

              }
            }
          }

    <style>
      :root {
        --paper: #F1EBDD;
        --paper-light: #FAF7F0;
        --ink: #151515;
        --ink-dark: #090909;
        --vermilion: #F04B16;
        --muted-ink: #8A877F;
      }
      body {
        font-family: 'DM Sans', -apple-system, sans-serif;
        background-color: #F1EBDD;
        color: #151515;
        overflow-x: hidden;
      }
      html {
        scroll-behavior: smooth;
        background-color: #F1EBDD;
      }
      ::selection {
        background-color: #F04B16;
        color: #FAF7F0;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F1EBDD;
      }
      ::-webkit-scrollbar-thumb {
        background: #8A877F;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #F04B16;
      }
      .paper-grain {
        background-image: radial-gradient(rgba(21, 21, 21, 0.04) 1px, transparent 0);
        background-size: 24px 24px;
      }
      .ink-grain {
        background-image: radial-gradient(rgba(241, 235, 221, 0.04) 1px, transparent 0);
        background-size: 24px 24px;
      }
      @keyframes heroFadeUp {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes heroWordReveal {
        0% {
          opacity: 0;
          transform: translateY(105%) skewY(2deg);
        }
        100% {
          opacity: 1;
          transform: translateY(0) skewY(0deg);
        }
      }
      @keyframes portraitMaskReveal {
        0% {
          opacity: 0;
          clip-path: inset(100% 0 0 0);
          transform: scale(1.04);
        }
        100% {
          opacity: 1;
          clip-path: inset(0 0 0 0);
          transform: scale(1);
        }
      }
      @keyframes modalEnter {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes modalBackdrop {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-modal-enter {
        animation: modalEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-modal-backdrop {
        animation: modalBackdrop 0.25s ease-out forwards;
      }
      .hero-word-wrap {
        display: block;
        overflow: visible;
        width: 100%;
      }
      .hero-word-1 {
        display: inline-block;
        animation: heroFadeUp 700ms cubic-bezier(0.16, 1, 0.3, 1) 60ms backwards;
      }
      .hero-word-2 {
        display: inline-block;
        animation: heroFadeUp 750ms cubic-bezier(0.16, 1, 0.3, 1) 160ms backwards;
      }
      .hero-portrait-reveal {
        animation: portraitMaskReveal 1000ms cubic-bezier(0.16, 1, 0.3, 1) 180ms backwards;
      }
      .hero-enter-1 {
        animation: heroFadeUp 600ms cubic-bezier(0.16, 1, 0.3, 1) 40ms backwards;
      }
      .hero-enter-2 {
        animation: heroFadeUp 650ms cubic-bezier(0.16, 1, 0.3, 1) 220ms backwards;
      }
      .hero-enter-3 {
        animation: heroFadeUp 650ms cubic-bezier(0.16, 1, 0.3, 1) 280ms backwards;
      }
      .hero-enter-4 {
        animation: heroFadeUp 700ms cubic-bezier(0.16, 1, 0.3, 1) 340ms backwards;
      }
      .hero-enter-5 {
        animation: heroFadeUp 700ms cubic-bezier(0.16, 1, 0.3, 1) 400ms backwards;
      }
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
